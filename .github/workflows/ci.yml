
name: Go service checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go code
        run: go vet ./...

      - name: Run Go tests
        run: go test -race ./...

      - name: Build Docker image
        run: docker build -t go-api-service:ci .
